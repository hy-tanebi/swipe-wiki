[project]
name = "swipe-wiki"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "HAYATO SUGAWARA", email = "hy.sugawara03@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg2>=2.9.13",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
swipe-wiki = "swipe_wiki:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
